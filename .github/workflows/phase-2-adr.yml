name: 'Phase 2 — ADR Generation'

# Reusable: called by codeweave.yml. Generate+validate ADRs; commits+pushes to
# the target work branch (needs PUSH_TOKEN via secrets: inherit). Builds adr.pdf
# + ADR-INDEX.md. Everything written into the target lives under
# src/codeweave-results/. Step logic lives in .github/scripts/phase-2.sh,
# shared with run-local.sh.

on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
    outputs:
      adr_complete:
        value: ${{ jobs.phase-2-adr.outputs.adr_complete }}
      iterations_run:
        value: ${{ jobs.phase-2-adr.outputs.iterations_run }}
      adr_pdf_built:
        value: ${{ jobs.phase-2-adr.outputs.adr_pdf_built }}
      adr_index_built:
        value: ${{ jobs.phase-2-adr.outputs.adr_index_built }}

permissions:
  contents: write

jobs:
  phase-2-adr:
    name: 'Phase 2: ADR Generation'
    runs-on: [self-hosted, Linux, X64]
    outputs:
      adr_complete:    ${{ steps.iterations.outputs.adr_complete }}
      iterations_run:  ${{ steps.iterations.outputs.iterations_run }}
      adr_pdf_built:   ${{ steps.build-adr-pdf.outputs.adr_pdf_built }}
      adr_index_built: ${{ steps.build-indexes.outputs.adr_index_built }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.ref }}
      - uses: ./.github/actions/codeweave-setup
        with:
          dry_run: ${{ inputs.dry_run }}
      - name: Check Phase 2 prerequisites
        run: bash .github/scripts/phase-2.sh prereq

      - name: Clone external repository into src
        env:
          GITHUB_PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: bash .github/scripts/phase-2.sh clone

      - name: Phase 2 iterations
        id: iterations
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # only used when AGENT_CLI=claude
        run: bash .github/scripts/phase-2.sh iterate

      - name: Build ADR PDF
        id: build-adr-pdf
        run: bash .github/scripts/phase-2.sh pdf

      - name: Generate navigation indexes
        id: build-indexes
        run: bash .github/scripts/phase-2.sh index

      - name: Publish book and PDFs into the target results folder
        run: bash .github/scripts/phase-2.sh publish

      - name: Push Phase 2 changes
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}"
          bash .github/scripts/phase-2.sh push-target
